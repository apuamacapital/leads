<!-- Formulário de leads (n8n). Cole este bloco inteiro num bloco "HTML personalizado" do WordPress. -->
<div class="lf-n8n">
  <style>
    .lf-n8n{max-width:420px;margin:0 auto;font-family:inherit}
    .lf-n8n label{display:block;font-weight:600;font-size:.9rem;margin:0 0 6px}
    .lf-n8n input{display:block;width:100%;box-sizing:border-box;padding:12px 14px;margin:0 0 14px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;background:#fff;color:#0f172a}
    .lf-n8n input:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.2)}
    .lf-n8n button{width:100%;padding:13px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-size:1rem;font-weight:600;cursor:pointer}
    .lf-n8n button:disabled{opacity:.6;cursor:wait}
    .lf-n8n .lf-msg{display:none;margin-top:14px;padding:12px 14px;border-radius:8px;font-size:.95rem}
    .lf-n8n .lf-ok{display:block;background:#dcfce7;color:#166534}
    .lf-n8n .lf-err{display:block;background:#fee2e2;color:#991b1b}
  </style>
  <form class="lf-form" novalidate>
    <label for="lf-name">Nome</label>
    <input id="lf-name" name="name" type="text" autocomplete="name" placeholder="Seu nome completo" required>
    <label for="lf-email">E-mail</label>
    <input id="lf-email" name="email" type="email" autocomplete="email" placeholder="voce@exemplo.com" required>
    <label for="lf-phone">Telefone</label>
    <input id="lf-phone" name="phone" type="tel" autocomplete="tel" inputmode="numeric" placeholder="(11) 91234-5678" maxlength="15" required>
    <button type="submit">Enviar</button>
    <div class="lf-msg" role="status" aria-live="polite"></div>
  </form>
  <script>
  (function () {
    var WEBHOOK_URL = "https://automacao.deepspacedata.tech/webhook/3fe1d7c0-b727-43b4-bb90-a2b052cf9262";
    var SOURCE = "site";

    var root = document.currentScript.parentNode;
    var form = root.querySelector(".lf-form");
    var phone = form.querySelector('[name="phone"]');
    var btn = form.querySelector("button");
    var msg = root.querySelector(".lf-msg");

    function mask(v) {
      var d = v.replace(/\D/g, "").slice(0, 11);
      if (d.length <= 2) return d.length ? "(" + d : "";
      if (d.length <= 6) return "(" + d.slice(0, 2) + ") " + d.slice(2);
      if (d.length <= 10) return "(" + d.slice(0, 2) + ") " + d.slice(2, 6) + "-" + d.slice(6);
      return "(" + d.slice(0, 2) + ") " + d.slice(2, 7) + "-" + d.slice(7);
    }
    phone.addEventListener("input", function () { phone.value = mask(phone.value); });

    function show(type, text) { msg.className = "lf-msg " + type; msg.textContent = text; }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      msg.className = "lf-msg";
      var name = form.querySelector('[name="name"]').value.trim();
      var email = form.querySelector('[name="email"]').value.trim();
      if (name.length < 2) return show("lf-err", "Informe seu nome.");
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return show("lf-err", "Informe um e-mail válido.");
      if (phone.value.replace(/\D/g, "").length < 10) return show("lf-err", "Informe um telefone com DDD.");

      btn.disabled = true; btn.textContent = "Enviando...";
      fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: name, email: email, phone: phone.value, timestamp: new Date().toISOString(), source: SOURCE })
      }).then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        form.reset();
        show("lf-ok", "Recebemos seus dados! Em breve entraremos em contato.");
      }).catch(function (err) {
        console.error(err);
        show("lf-err", "Não foi possível enviar agora. Tente novamente em instantes.");
      }).finally(function () {
        btn.disabled = false; btn.textContent = "Enviar";
      });
    });
  })();
  </script>
</div>
